name: Auto Publish Landing (restricted)

on:
  push:
    branches:
      - main

jobs:
  publish-landing:
    name: Auto publish landing to Cloudflare Pages (restricted)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical landing and retained review files exist
        run: |
          required=(index.html _redirects web/live/js/checkout-config.js web/live/js/checkout.js)
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"; exit 1
            fi
          done
          legacy_review_files=(root.html buy.html purchase.html gum.html test-variants.html)
          for f in "${legacy_review_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Missing retained review file: $f"; exit 1
            fi
          done
          # SEO files are expected for signkit.work.
          for f in robots.txt sitemap.xml 404.html; do
            if [ ! -f "$f" ]; then
              echo "Missing recommended file: $f"; exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install landing contract test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Install Wrangler
        run: |
          npm install -g @cloudflare/wrangler

      - name: Run canonical landing contract checks
        run: |
          bash scripts/test-local-landing.sh

      - name: Check Cloudflare secrets
        id: cf_secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not configured; skipping Pages deploy (Cloudflare Git integration may still deploy)."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudflare Pages
        if: steps.cf_secrets.outputs.skip != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Publishing main branch landing page to Cloudflare Pages (project: signkit-landing)"
          wrangler pages deploy . --project-name signkit-landing --branch main

      - name: Verify deployed canonical routes
        if: steps.cf_secrets.outputs.skip != 'true'
        run: bash scripts/test-deployment.sh https://signkit.work

      - name: Done
        run: echo "Auto publish to Cloudflare Pages finished."

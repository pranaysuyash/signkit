name: Landing Smoke Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure canonical landing and retained review files exist
        run: |
          test -f index.html
          test -f root.html
          test -f buy.html
          test -f purchase.html
          test -f gum.html
          test -f test-variants.html
          test -f robots.txt
          test -f sitemap.xml
          test -f _redirects
          test -f web/live/js/checkout-config.js
          test -f web/live/js/checkout.js
      - name: Install landing contract test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Landing route and provider contract
        run: python -m pytest -q tests/test_landing_surface_contract.py
      - name: Local static server smoke test
        run: |
          chmod +x scripts/test-local-landing.sh
          ./scripts/test-local-landing.sh
      - name: Optional production smoke test
        if: ${{ github.ref_name == 'main' }}
        run: |
          chmod +x scripts/test-deployment.sh
          ./scripts/test-deployment.sh https://signkit.work

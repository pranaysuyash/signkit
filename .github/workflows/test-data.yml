name: Test Data Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test-data:
    name: Project venv, manifest, and extractor corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create project environment
        run: python -m venv .venv
      - name: Install project runtime dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r desktop_app/requirements.txt
      - name: Enforce project interpreter and imports
        run: ./.venv/bin/python tools/validate_test_data_environment.py --repo-root .
      - name: Enforce backend interpreter and imports
        run: ./.venv/bin/python tools/validate_test_data_environment.py --repo-root . --backend
      - name: Apply backend migrations in an isolated CI database
        env:
          DATABASE_URL: sqlite:///./ci-backend-migration.sqlite
          JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes-long
          PYTHONPATH: ..
        working-directory: backend
        run: ../.venv/bin/alembic -c alembic.ini upgrade head
      - name: Run backend contract tests
        env:
          DATABASE_URL: sqlite:///./ci-backend-tests.sqlite
          JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes-long
        run: ./.venv/bin/python -m pytest -q backend/tests/test_extraction_router.py backend/tests/test_extraction_hosted.py backend/tests/test_workspace_router.py backend/tests/test_workspace_service.py
      - name: Run reproducible release QA matrix
        env:
          DATABASE_URL: sqlite:///./ci-qa.sqlite
          JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes-long
          QT_QPA_PLATFORM: offscreen
        run: >-
          ./.venv/bin/pytest -q
          tests/test_ci_workflow_contract.py
          tests/test_security.py
          tests/test_configuration_contract.py
          backend/tests/test_extraction_router.py
          backend/tests/test_workspace_router.py
          desktop_app/tests/test_coordinate_mapping.py
          desktop_app/tests/test_api_client.py
          desktop_app/tests/test_main_window_logic.py
      - name: Run authenticated extraction hosted smoke
        run: ./.venv/bin/python tools/run_extraction_hosted_smoke.py
      - name: Validate test-data manifest
        run: ./.venv/bin/python tools/validate_test_data_manifest.py --manifest docs/test_data_manifest.md --repo-root .
      - name: Validate signature corpus annotations
        run: ./.venv/bin/python tools/validate_signature_corpus.py --repo-root .
      - name: Run extractor corpus checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./.venv/bin/pytest -q desktop_app/tests/test_extractor.py desktop_app/tests/test_signature_edge_cases.py
      - name: Run labeled-corpus metric checks
        run: ./.venv/bin/pytest -q tests/test_signature_corpus_evaluation.py tests/test_signature_corpus_validation.py
      - name: Run curated S3 test-sensitivity gate
        run: ./.venv/bin/python tools/mutation_check.py
      - name: Run public-surface contract checks
        run: ./.venv/bin/python -m pytest -q tests/test_launch_claim_registry.py tests/test_public_surface_audit.py tests/test_deployed_surface_probe.py
      - name: Run local deployment smoke matrix
        shell: bash
        run: |
          set -euo pipefail
          ./.venv/bin/python serve.py > ci-serve.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              cat ci-serve.log
              exit 1
            fi
            sleep 1
          done
          bash scripts/test-deployment.sh http://127.0.0.1:8080
      - name: Check JavaScript and release-gate syntax
        run: |
          ./.venv/bin/python -m py_compile serve.py tools/audit_public_surface.py tools/test_deployed_surface.py
          node --check web/live/js/checkout.js
          bash -n scripts/test-deployment.sh scripts/deploy_canonical_landing.sh

name: Manual Pages Publish (landing)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to publish from (defaults to main)'
        required: false
        default: 'main'

jobs:
  publish-landing:
    name: Publish landing to Cloudflare Pages (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install landing contract test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Install Wrangler
        run: |
          npm install -g @cloudflare/wrangler

      - name: Run canonical landing contract checks
        run: |
          bash scripts/test-local-landing.sh

      - name: Ensure secrets are present
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN must be set in repository secrets";
            exit 1;
          fi

      - name: Configure auth
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Configuring Wrangler via env..."
          # Wrangler will pick up env vars via standard env

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler pages deploy . --project-name signkit-landing --branch "${{ github.event.inputs.branch }}"

      - name: Verify deployed canonical routes
        if: ${{ github.event.inputs.branch == 'main' }}
        run: bash scripts/test-deployment.sh https://signkit.work

      - name: Done
        run: echo "Cloudflare Pages publish finished."

name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'manual-build'

permissions:
  contents: write

jobs:
  build-macos-intel:
    name: macOS Intel (x86_64)
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install system dependencies
        run: |
          brew install qpdf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop_app/requirements.txt
          pip install -r build-tools/requirements-build.txt

      - name: Build Intel app
        run: |
          python build-tools/build.py --build-platform darwin --profile standard --spec build-tools/SignatureExtractor_Intel.spec

      - name: Verify build
        run: |
          if [ ! -d "dist/SignKit.app" ]; then
            echo "Build failed - app not found"
            exit 1
          fi
          ls -lh dist/

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "SignKit (Intel)" \
            -srcfolder dist/SignKit.app \
            -ov \
            -format UDZO \
            dist/SignKit_macOS_Intel.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignKit-macOS-Intel
          path: dist/SignKit_macOS_Intel.dmg
          retention-days: 30

  build-macos-arm64:
    name: macOS Apple Silicon (ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop_app/requirements.txt
          pip install -r build-tools/requirements-build.txt

      - name: Build ARM64 app
        run: |
          python build-tools/build.py --build-platform darwin --profile standard --spec build-tools/SignatureExtractor_macOS.spec

      - name: Verify build
        run: |
          if [ ! -d "dist/SignKit.app" ]; then
            echo "Build failed - app not found"
            exit 1
          fi
          ls -lh dist/

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "SignKit (Apple Silicon)" \
            -srcfolder dist/SignKit.app \
            -ov \
            -format UDZO \
            dist/SignKit_macOS_ARM64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignKit-macOS-ARM64
          path: dist/SignKit_macOS_ARM64.dmg
          retention-days: 30

  build-macos-premium-arm64:
    name: macOS Apple Silicon Premium (ARM64)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'arm64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop_app/requirements.txt
          pip install -r build-tools/requirements-build.txt

      - name: Build Premium ARM64 app
        run: |
          python build-tools/build.py --build-platform darwin --profile mac-premium --spec build-tools/SignatureExtractor_macOS_Premium.spec

      - name: Verify build
        run: |
          if [ ! -d "dist/SignKitPremium.app" ]; then
            echo "Build failed - app not found"
            exit 1
          fi
          ls -lh dist/

      - name: Create Premium DMG
        run: |
          hdiutil create \
            -volname "SignKit Premium (Apple Silicon)" \
            -srcfolder dist/SignKitPremium.app \
            -ov \
            -format UDZO \
            dist/SignKit_Premium_macOS_ARM64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignKit-Premium-macOS-ARM64
          path: dist/SignKit_Premium_macOS_ARM64.dmg
          retention-days: 30

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop_app/requirements.txt
          pip install -r build-tools/requirements-build.txt

      - name: Build Windows executable
        run: |
          python build-tools/build.py --build-platform win64 --profile standard --spec build-tools/SignatureExtractor_Windows.spec

      - name: Rename executable
        run: |
          if (Test-Path "dist/SignKit.exe") {
            Move-Item "dist/SignKit.exe" "dist/SignKit_Windows.exe"
          } elseif (Test-Path "dist/SignatureExtractor.exe") {
            Move-Item "dist/SignatureExtractor.exe" "dist/SignKit_Windows.exe"
          } else {
            Write-Error "Build failed - exe not found"
            exit 1
          }

      - name: Create ZIP
        run: |
          Compress-Archive -Path dist/SignKit_Windows.exe -DestinationPath dist/SignKit_Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignKit-Windows
          path: dist/SignKit_Windows.zip
          retention-days: 30

  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libgl1-mesa-glx \
            libegl1-mesa \
            libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop_app/requirements.txt
          pip install -r build-tools/requirements-build.txt

      - name: Build Linux executable
        run: |
          python build-tools/build.py --build-platform linux --profile standard --spec build-tools/SignatureExtractor_Linux.spec

      - name: Rename and make executable
        run: |
          if [ -f "dist/SignatureExtractor" ]; then
            mv dist/SignatureExtractor dist/SignKit_Linux
            chmod +x dist/SignKit_Linux
          else
            echo "Build failed - executable not found"
            exit 1
          fi

      - name: Bundle Linux assets
        run: |
          mkdir -p dist/SignKit_Linux_bundle/icons
          mv dist/SignKit_Linux dist/SignKit_Linux_bundle/SignKit_Linux
          cp assets/signkit.desktop dist/SignKit_Linux_bundle/
          cp assets/LINUX_INSTALLATION.md dist/SignKit_Linux_bundle/
          cp assets/files/signkit_icon_*.png dist/SignKit_Linux_bundle/icons/

      - name: Create tar.gz
        run: |
          cd dist
          tar -czf SignKit_Linux.tar.gz SignKit_Linux_bundle
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignKit-Linux
          path: dist/SignKit_Linux.tar.gz
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-macos-intel, build-macos-arm64, build-macos-premium-arm64, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure
        run: ls -R ./artifacts

      - name: Enforce canonical public-surface claim contract
        run: python3 tools/audit_public_surface.py --strict

      - name: Build and enforce release artifact ledger
        env:
          SIGNKIT_ROLLBACK_ARTIFACT: ${{ vars.SIGNKIT_ROLLBACK_ARTIFACT }}
          SIGNKIT_MACOS_INTEL_SIGNING_STATUS: ${{ vars.SIGNKIT_MACOS_INTEL_SIGNING_STATUS }}
          SIGNKIT_MACOS_INTEL_SMOKE_STATUS: ${{ vars.SIGNKIT_MACOS_INTEL_SMOKE_STATUS }}
          SIGNKIT_MACOS_INTEL_SIGNING_EVIDENCE: ${{ vars.SIGNKIT_MACOS_INTEL_SIGNING_EVIDENCE }}
          SIGNKIT_MACOS_INTEL_SMOKE_EVIDENCE: ${{ vars.SIGNKIT_MACOS_INTEL_SMOKE_EVIDENCE }}
          SIGNKIT_MACOS_ARM64_SIGNING_STATUS: ${{ vars.SIGNKIT_MACOS_ARM64_SIGNING_STATUS }}
          SIGNKIT_MACOS_ARM64_SMOKE_STATUS: ${{ vars.SIGNKIT_MACOS_ARM64_SMOKE_STATUS }}
          SIGNKIT_MACOS_ARM64_SIGNING_EVIDENCE: ${{ vars.SIGNKIT_MACOS_ARM64_SIGNING_EVIDENCE }}
          SIGNKIT_MACOS_ARM64_SMOKE_EVIDENCE: ${{ vars.SIGNKIT_MACOS_ARM64_SMOKE_EVIDENCE }}
          SIGNKIT_PREMIUM_MACOS_ARM64_SIGNING_STATUS: ${{ vars.SIGNKIT_PREMIUM_MACOS_ARM64_SIGNING_STATUS }}
          SIGNKIT_PREMIUM_MACOS_ARM64_SMOKE_STATUS: ${{ vars.SIGNKIT_PREMIUM_MACOS_ARM64_SMOKE_STATUS }}
          SIGNKIT_PREMIUM_MACOS_ARM64_SIGNING_EVIDENCE: ${{ vars.SIGNKIT_PREMIUM_MACOS_ARM64_SIGNING_EVIDENCE }}
          SIGNKIT_PREMIUM_MACOS_ARM64_SMOKE_EVIDENCE: ${{ vars.SIGNKIT_PREMIUM_MACOS_ARM64_SMOKE_EVIDENCE }}
          SIGNKIT_WINDOWS_SIGNING_STATUS: ${{ vars.SIGNKIT_WINDOWS_SIGNING_STATUS }}
          SIGNKIT_WINDOWS_SMOKE_STATUS: ${{ vars.SIGNKIT_WINDOWS_SMOKE_STATUS }}
          SIGNKIT_WINDOWS_SIGNING_EVIDENCE: ${{ vars.SIGNKIT_WINDOWS_SIGNING_EVIDENCE }}
          SIGNKIT_WINDOWS_SMOKE_EVIDENCE: ${{ vars.SIGNKIT_WINDOWS_SMOKE_EVIDENCE }}
          SIGNKIT_LINUX_SIGNING_STATUS: ${{ vars.SIGNKIT_LINUX_SIGNING_STATUS }}
          SIGNKIT_LINUX_SMOKE_STATUS: ${{ vars.SIGNKIT_LINUX_SMOKE_STATUS }}
          SIGNKIT_LINUX_SIGNING_EVIDENCE: ${{ vars.SIGNKIT_LINUX_SIGNING_EVIDENCE }}
          SIGNKIT_LINUX_SMOKE_EVIDENCE: ${{ vars.SIGNKIT_LINUX_SMOKE_EVIDENCE }}
        run: |
          python3 tools/release_artifact_ledger.py \
            --output ./artifacts/release_artifact_ledger.json \
            --markdown-output ./artifacts/release_artifact_ledger.md \
            --release-tag "${GITHUB_REF_NAME}" \
            --source-sha "${GITHUB_SHA}" \
            --release-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --rollback-artifact "${SIGNKIT_ROLLBACK_ARTIFACT:-not-recorded}" \
            --artifact "SignKit macOS Intel|macOS|x86_64|./artifacts/SignKit-macOS-Intel/SignKit_macOS_Intel.dmg|${SIGNKIT_MACOS_INTEL_SIGNING_STATUS:-not_verified}|${SIGNKIT_MACOS_INTEL_SMOKE_STATUS:-not_run}|${SIGNKIT_MACOS_INTEL_SIGNING_EVIDENCE:-not-recorded}|${SIGNKIT_MACOS_INTEL_SMOKE_EVIDENCE:-not-recorded}" \
            --artifact "SignKit macOS ARM64|macOS|arm64|./artifacts/SignKit-macOS-ARM64/SignKit_macOS_ARM64.dmg|${SIGNKIT_MACOS_ARM64_SIGNING_STATUS:-not_verified}|${SIGNKIT_MACOS_ARM64_SMOKE_STATUS:-not_run}|${SIGNKIT_MACOS_ARM64_SIGNING_EVIDENCE:-not-recorded}|${SIGNKIT_MACOS_ARM64_SMOKE_EVIDENCE:-not-recorded}" \
            --artifact "SignKit Premium macOS ARM64|macOS|arm64|./artifacts/SignKit-Premium-macOS-ARM64/SignKit_Premium_macOS_ARM64.dmg|${SIGNKIT_PREMIUM_MACOS_ARM64_SIGNING_STATUS:-not_verified}|${SIGNKIT_PREMIUM_MACOS_ARM64_SMOKE_STATUS:-not_run}|${SIGNKIT_PREMIUM_MACOS_ARM64_SIGNING_EVIDENCE:-not-recorded}|${SIGNKIT_PREMIUM_MACOS_ARM64_SMOKE_EVIDENCE:-not-recorded}" \
            --artifact "SignKit Windows|Windows|x86_64|./artifacts/SignKit-Windows/SignKit_Windows.zip|${SIGNKIT_WINDOWS_SIGNING_STATUS:-not_verified}|${SIGNKIT_WINDOWS_SMOKE_STATUS:-not_run}|${SIGNKIT_WINDOWS_SIGNING_EVIDENCE:-not-recorded}|${SIGNKIT_WINDOWS_SMOKE_EVIDENCE:-not-recorded}" \
            --artifact "SignKit Linux|Linux|x86_64|./artifacts/SignKit-Linux/SignKit_Linux.tar.gz|${SIGNKIT_LINUX_SIGNING_STATUS:-not_verified}|${SIGNKIT_LINUX_SMOKE_STATUS:-not_run}|${SIGNKIT_LINUX_SIGNING_EVIDENCE:-not-recorded}|${SIGNKIT_LINUX_SMOKE_EVIDENCE:-not-recorded}" \
            --require-ready

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/SignKit-macOS-Intel/SignKit_macOS_Intel.dmg
            ./artifacts/SignKit-macOS-ARM64/SignKit_macOS_ARM64.dmg
            ./artifacts/SignKit-Premium-macOS-ARM64/SignKit_Premium_macOS_ARM64.dmg
            ./artifacts/SignKit-Windows/SignKit_Windows.zip
            ./artifacts/SignKit-Linux/SignKit_Linux.tar.gz
            ./artifacts/release_artifact_ledger.json
            ./artifacts/release_artifact_ledger.md
          body: |
            # SignKit ${{ github.ref_name }}

            Professional signature extraction and PDF workflow. Core document
            processing runs locally by default. Checkout, updates, and support
            use network services only when you choose them.

            This release is published only after the release artifact ledger
            records checksums, signing status, smoke status, and a rollback
            artifact for every platform. See `release_artifact_ledger.md` for
            the operator-readable record.

            ## 📥 Downloads

            ### macOS
            - **Apple Silicon (M1/M2/M3/M4)**: `SignKit_macOS_ARM64.dmg`
            - **Apple Silicon Premium**: `SignKit_Premium_macOS_ARM64.dmg`
            - **Intel**: `SignKit_macOS_Intel.dmg`

            ### Windows
            - **Windows 10/11 (64-bit)**: `SignKit_Windows.zip`

            ### Linux
            - **Ubuntu 20.04+ (64-bit)**: `SignKit_Linux.tar.gz`

            ## 🚀 Installation

            ### macOS
            1. Download the appropriate DMG for your Mac
            2. Open the DMG file
            3. Drag SignKit to Applications
            4. Right-click and select "Open" (first launch only)

            ### Windows
            1. Download `SignKit_Windows.zip`
            2. Extract the ZIP file
            3. Run `SignKit_Windows.exe`
            4. Windows may show a security warning - click "More info" → "Run anyway"

            ### Linux
            1. Download `SignKit_Linux.tar.gz`
            2. Extract: `tar -xzf SignKit_Linux.tar.gz`
            3. Make executable: `chmod +x SignKit_Linux`
            4. Run: `./SignKit_Linux`

            ## ✨ Features

            - Extract signatures from photos with precision controls
            - Sign PDFs directly in the app
            - Local-first document processing with an explicit connected-service boundary
            - Library management for saved signatures
            - Export to PNG/JPG

            ## 🔑 License

            Purchase a license at: https://signkit.work

            ## 📖 Documentation

            - Quick Start Guide: https://docs.signkit.work
            - Support: support@signkit.work

            ---

            **System Requirements:**
            - macOS: 10.15 (Catalina) or later
            - Windows: Windows 10 or later
            - Linux: Ubuntu 20.04 or equivalent
            - RAM: 4GB minimum (8GB recommended)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    needs: [build-macos-intel, build-macos-arm64, build-macos-premium-arm64, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate summary
        run: |
          echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "./artifacts/SignKit-macOS-Intel/SignKit_macOS_Intel.dmg" ]; then
            SIZE=$(du -h "./artifacts/SignKit-macOS-Intel/SignKit_macOS_Intel.dmg" | cut -f1)
            echo "✅ macOS Intel: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ macOS Intel: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "./artifacts/SignKit-macOS-ARM64/SignKit_macOS_ARM64.dmg" ]; then
            SIZE=$(du -h "./artifacts/SignKit-macOS-ARM64/SignKit_macOS_ARM64.dmg" | cut -f1)
            echo "✅ macOS ARM64: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ macOS ARM64: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "./artifacts/SignKit-Premium-macOS-ARM64/SignKit_Premium_macOS_ARM64.dmg" ]; then
            SIZE=$(du -h "./artifacts/SignKit-Premium-macOS-ARM64/SignKit_Premium_macOS_ARM64.dmg" | cut -f1)
            echo "✅ macOS Premium ARM64: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ macOS Premium ARM64: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "./artifacts/SignKit-Windows/SignKit_Windows.zip" ]; then
            SIZE=$(du -h "./artifacts/SignKit-Windows/SignKit_Windows.zip" | cut -f1)
            echo "✅ Windows: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Windows: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "./artifacts/SignKit-Linux/SignKit_Linux.tar.gz" ]; then
            SIZE=$(du -h "./artifacts/SignKit-Linux/SignKit_Linux.tar.gz" | cut -f1)
            echo "✅ Linux: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Linux: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download artifacts from this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "2. Test each build on its respective platform" >> $GITHUB_STEP_SUMMARY
          echo "3. Upload to Gumroad product page" >> $GITHUB_STEP_SUMMARY
          echo "4. Create release notes" >> $GITHUB_STEP_SUMMARY
